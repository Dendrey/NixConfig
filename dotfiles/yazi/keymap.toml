[manager]
prepend_keymap = [
    # Удаление в корзину через trash-cli вместо rm
    { on = [ "d" ], run = "shell 'trash-put \"$@\"' --confirm", desc = "Move to trash" },
    
    # Быстрый переход к монтированным флешкам
    { on = [ "g", "m" ], run = "cd /run/media/dendrey/", desc = "Go to mounted media" },
    { on = [ "g", "d" ], run = "cd ~/Downloads", desc = "Go to Downloads" },
    { on = [ "g", "D" ], run = "cd ~/Documents", desc = "Go to Documents" }
]
